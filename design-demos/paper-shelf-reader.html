<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>纸感书架与阅读</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,450;1,6..72,560&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #E6DDD0; color: #241C14; }
    body { font-family: "Noto Serif SC", "Songti SC", serif; text-wrap: pretty; }
    button, input { font-family: inherit; }
    button { cursor: pointer; }
    .pr-row:hover { background: rgba(36, 28, 20, 0.045); }
    .pr-quiet:hover { color: #241C14; }
    .pr-field:focus { outline: none; border-bottom-color: #241C14; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const INK = "#241C14";
    const SOFT = "#7A6A58";
    const PAPER = "#F4EFE6";
    const COVER = "#E9E0D2";
    const RULE = "#E2D6C6";
    const SERIF = '"Noto Serif SC", "Songti SC", serif';
    const NEWS = '"Newsreader", "Noto Serif SC", serif';

    const androidFrameStyles = {
      wrapper: { display: "inline-block", padding: 10, background: "#1A1816", borderRadius: 40, boxShadow: "0 18px 50px rgba(36,28,20,0.18)", position: "relative" },
      screen: { position: "relative", borderRadius: 32, overflow: "hidden", background: PAPER },
      statusBar: { position: "absolute", top: 0, left: 0, right: 0, height: 32, display: "flex", alignItems: "center", justifyContent: "space-between", padding: "0 22px", fontSize: 13, fontWeight: 500, fontFamily: NEWS, zIndex: 20, pointerEvents: "none" },
      punchHole: { position: "absolute", top: 10, left: "50%", transform: "translateX(-50%)", width: 12, height: 12, background: "#0E0C0A", borderRadius: "50%", zIndex: 30 },
      statusIcons: { display: "flex", alignItems: "center", gap: 6 },
      content: { position: "absolute", top: 32, left: 0, right: 0, bottom: 22, overflow: "hidden" },
      navBar: { position: "absolute", bottom: 0, left: 0, right: 0, height: 22, display: "flex", alignItems: "center", justifyContent: "center", zIndex: 10 }
    };

    function AndroidFrame({ children, width = 352, height = 740, time = "9:41", battery = 86 }) {
      return (
        <div style={androidFrameStyles.wrapper}>
          <div style={{ ...androidFrameStyles.screen, width, height }}>
            <div style={{ ...androidFrameStyles.statusBar, color: INK }}>
              <span>{time}</span>
              <div style={androidFrameStyles.statusIcons}>
                <svg width="14" height="10" viewBox="0 0 14 10" fill={INK}><rect x="0" y="6" width="2" height="4" rx="0.5" /><rect x="4" y="4" width="2" height="6" rx="0.5" /><rect x="8" y="2" width="2" height="8" rx="0.5" /><rect x="12" y="0" width="2" height="10" rx="0.5" /></svg>
                <div style={{ width: 20, height: 9, border: "1.4px solid " + INK, borderRadius: 2, padding: 1 }}>
                  <div style={{ width: battery + "%", height: "100%", background: INK }} />
                </div>
              </div>
            </div>
            <div style={androidFrameStyles.punchHole} />
            <div style={androidFrameStyles.content}>{children}</div>
            <div style={androidFrameStyles.navBar}>
              <div style={{ width: 96, height: 4, borderRadius: 99, background: "rgba(36,28,20,0.35)" }} />
            </div>
          </div>
        </div>
      );
    }

    const SEED = [
      { id: "bian", title: "边城", author: "沈从文", format: "EPUB", tag: "小说 / 现代", progress: 0.62, downloaded: true, locked: false, current: true },
      { id: "bai", title: "百年孤独", author: "加西亚·马尔克斯", format: "EPUB", tag: "小说 / 拉美", progress: 0.18, downloaded: true, locked: true, current: false },
      { id: "ren", title: "人类简史", author: "尤瓦尔·赫拉利", format: "PDF", tag: "社科", progress: 0, downloaded: false, locked: false, current: false },
      { id: "wa", title: "瓦尔登湖", author: "梭罗", format: "TXT", tag: "散文", progress: 0.41, downloaded: true, locked: false, current: false },
      { id: "xiao", title: "小王子", author: "圣埃克苏佩里", format: "KEPUB", tag: "", progress: 0.08, downloaded: true, locked: false, current: false }
    ];

    const PAGES = [
      ["天亮以前，水是没有声音的。船靠在桩上，缆绳松着。我把窗开了一指宽，外面的白不是光，是雾。", "舱里只点了一盏很小的灯。灯油的味道比光先到。书摊在膝上，这一页的行距刚好够手指停下。", "岸上有人咳嗽，很轻。我把这一页又读了一遍，不是为了情节，是为了确认自己还停在同一段里。"],
      ["雾后来退了。不是散开，是沉进水里。水就比夜里深了一个颜色。对岸的松只剩一截深的尖。", "我把昨夜折过的角抚平。纸比人更记得手。角还在，只是不再翘起来。", "船身轻轻碰了一下桩。这一碰很短，短到不像声音。"],
      ["天亮的时候我合上书。书脊是温的。岸上的人已经走了，桩上的缆绳还维持着夜里的形状。", "我没有再折角。这一章还没有完，完的只是这一页。", "窗又开宽一指。雾不在了。水还在，比夜里浅，也比夜里安静。"]
    ];

    function matchBook(book, query, offlineOnly) {
      if (offlineOnly && !book.downloaded) return false;
      const q = query.trim().toLowerCase();
      if (!q) return true;
      return (book.title + " " + book.author + " " + book.tag).toLowerCase().includes(q);
    }

    const paperStyles = {
      app: { height: "100%", display: "flex", flexDirection: "column", background: PAPER, color: INK, position: "relative" },
      scrim: { position: "absolute", inset: 0, background: "rgba(36,28,20,0.28)", display: "flex", alignItems: "flex-end", zIndex: 8 },
      sheet: { width: "100%", background: PAPER, padding: "18px 22px 26px", borderTop: "1px solid " + RULE },
      sheetTitle: { fontFamily: SERIF, fontSize: 18, marginBottom: 8 },
      sheetRow: { display: "block", width: "100%", textAlign: "left", background: "transparent", border: "none", borderTop: "1px solid " + RULE, color: INK, fontSize: 15, padding: "13px 0", cursor: "pointer" },
      field: { width: "100%", background: "transparent", border: "none", borderBottom: "1px solid " + RULE, color: INK, fontSize: 16, padding: "10px 0", marginTop: 8 }
    };

    function Sheet({ title, onClose, children }) {
      return (
        <div style={paperStyles.scrim} onClick={onClose}>
          <div style={paperStyles.sheet} onClick={(e) => e.stopPropagation()}>
            <div style={paperStyles.sheetTitle}>{title}</div>
            {children}
          </div>
        </div>
      );
    }

    function Shelf({ books, view, query, offlineOnly, onQuery, onOffline, onToggleView, onOpen, onMenu, onAdd, moreOpen, onMore }) {
      const shown = books.filter((book) => matchBook(book, query, offlineOnly));
      return (
        <div style={paperStyles.app}>
          <div style={{ padding: "18px 22px 0", display: "flex", justifyContent: "space-between", alignItems: "flex-end" }}>
            <div>
              <div style={{ fontFamily: NEWS, fontStyle: "italic", fontSize: 13, color: SOFT }}>BookReader</div>
              <div style={{ fontSize: 32, lineHeight: 1.15, fontWeight: 600 }}>书架</div>
            </div>
            <div style={{ display: "flex", gap: 14, paddingBottom: 6 }}>
              <button className="pr-quiet" data-action="add" onClick={onAdd} style={{ background: "none", border: "none", color: INK, fontSize: 14 }}>导入</button>
              <button className="pr-quiet" data-action="toggle-view" onClick={onToggleView} style={{ background: "none", border: "none", color: SOFT, fontSize: 14 }}>{view === "list" ? "网格" : "列表"}</button>
              <button className="pr-quiet" data-action="more" onClick={onMore} style={{ background: "none", border: "none", color: SOFT, fontSize: 14 }}>更多</button>
            </div>
          </div>
          <div style={{ padding: "14px 22px 0" }}>
            <input className="pr-field" data-action="search" value={query} onChange={(e) => onQuery(e.target.value)} placeholder="搜索书名、作者或标签" style={{ ...paperStyles.field, marginTop: 0 }} />
            <div style={{ display: "flex", gap: 18, marginTop: 12 }}>
              <button data-action="filter-all" onClick={() => onOffline(false)} style={{ background: "none", border: "none", padding: "0 0 4px", fontSize: 13, color: offlineOnly ? SOFT : INK, borderBottom: offlineOnly ? "1px solid transparent" : "1px solid " + INK }}>全部</button>
              <button data-action="filter-offline" onClick={() => onOffline(true)} style={{ background: "none", border: "none", padding: "0 0 4px", fontSize: 13, color: offlineOnly ? INK : SOFT, borderBottom: offlineOnly ? "1px solid " + INK : "1px solid transparent" }}>仅离线</button>
            </div>
          </div>
          <div style={{ flex: 1, minHeight: 0, position: "relative" }}>
            <div style={{ height: "100%", overflow: "auto", padding: view === "list" ? "8px 10px 18px" : "16px 18px 22px" }}>
              {shown.length === 0 && <div style={{ color: SOFT, padding: 22, fontSize: 14 }}>没有对上的书</div>}
              {view === "list" ? shown.map((book) => (
                <div key={book.id} className="pr-row" style={{ display: "flex", gap: 12, alignItems: "stretch", padding: "12px", borderBottom: "1px solid " + RULE }}>
                  <button data-book={book.id} data-action="open" onClick={() => onOpen(book)} style={{ flex: 1, display: "flex", gap: 12, textAlign: "left", background: "none", border: "none", color: INK, padding: 0, minWidth: 0 }}>
                    <div style={{ width: 6, background: book.current ? INK : "transparent", flex: "none" }} />
                    <div style={{ minWidth: 0 }}>
                      <div style={{ fontSize: 18, fontWeight: 600, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{book.title}</div>
                      <div style={{ marginTop: 3, fontSize: 12, color: SOFT }}>{book.author}{book.tag ? "  ·  " + book.tag : ""}{book.locked ? "  ·  加密" : ""}{book.downloaded ? "" : "  ·  未下载"}</div>
                      {book.progress > 0 && (
                        <div style={{ marginTop: 8, height: 2, background: RULE }}>
                          <div style={{ width: (book.progress * 100) + "%", height: "100%", background: INK }} />
                        </div>
                      )}
                    </div>
                  </button>
                  <button data-action="menu" data-book={book.id} onClick={() => onMenu(book)} style={{ background: "none", border: "none", color: SOFT, fontSize: 18, padding: "0 4px" }}>···</button>
                </div>
              )) : (
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
                  {shown.map((book) => (
                    <button key={book.id} data-book={book.id} data-action="open" onClick={() => onOpen(book)} style={{ textAlign: "left", border: "none", padding: 0, background: "none", color: INK, cursor: "pointer" }}>
                      <div style={{ height: 132, background: book.current ? INK : COVER, color: book.current ? PAPER : INK, padding: "12px 12px 10px", display: "flex", flexDirection: "column" }}>
                        <div style={{ fontFamily: NEWS, fontSize: 11, letterSpacing: "0.16em" }}>{book.format}</div>
                        <div style={{ flex: 1 }} />
                        <div style={{ fontSize: 18, fontWeight: 600, lineHeight: 1.35 }}>{book.title}</div>
                        <div style={{ fontSize: 11, opacity: 0.72, marginTop: 8 }}>{book.author}</div>
                      </div>
                      <div style={{ marginTop: 6, fontSize: 11, color: SOFT, minHeight: 16 }}>{book.tag || " "}</div>
                      <div style={{ marginTop: 4, height: 2, background: RULE }}>
                        <div style={{ width: (book.progress * 100) + "%", height: "100%", background: INK }} />
                      </div>
                    </button>
                  ))}
                </div>
              )}
            </div>
          </div>
          {moreOpen && (
            <Sheet title="更多" onClose={onMore}>
              <button style={paperStyles.sheetRow}>词典与翻译</button>
              <button style={paperStyles.sheetRow}>同步进度</button>
              <button style={paperStyles.sheetRow}>界面语言</button>
              <div style={{ ...paperStyles.sheetRow, color: SOFT }}>mason</div>
            </Sheet>
          )}
        </div>
      );
    }

    function Reader({ book, page, chrome, progressMode, hand, onZone, onFooter, onBack, onPrefs, onChapter }) {
      const paragraphs = PAGES[page];
      const left = 12 - page;
      const percent = 62 + page * 2;
      const showWords = progressMode !== "hidden";
      return (
        <div style={paperStyles.app}>
          {chrome && (
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "8px 12px", borderBottom: "1px solid " + RULE }}>
              <button data-action="back" onClick={onBack} style={{ background: "none", border: "none", color: INK, fontSize: 14 }}>返回</button>
              <div style={{ fontSize: 14, fontWeight: 600 }}>{book.title}</div>
              <button data-action="toc" style={{ background: "none", border: "none", color: SOFT, fontSize: 14 }}>目录</button>
            </div>
          )}
          <div style={{ flex: 1, minHeight: 0, position: "relative" }}>
            <div style={{ height: "100%", overflow: "hidden", padding: "26px 26px 8px" }}>
              <div style={{ fontSize: 12, letterSpacing: "0.24em", color: SOFT, marginBottom: 16 }}>第二章</div>
              {paragraphs.map((line) => (
                <p key={line.slice(0, 8)} style={{ margin: "0 0 16px", fontSize: 17, lineHeight: 1.95, fontWeight: 400 }}>{line}</p>
              ))}
            </div>
            <button data-zone="left" data-action="zone" onClick={() => onZone("left")} style={{ position: "absolute", left: 0, top: 0, bottom: 0, width: "35%", background: "transparent", border: "none" }} />
            <button data-zone="center" data-action="zone" onClick={() => onZone("center")} style={{ position: "absolute", left: "35%", top: 0, bottom: 0, width: "30%", background: "transparent", border: "none" }} />
            <button data-zone="right" data-action="zone" onClick={() => onZone("right")} style={{ position: "absolute", right: 0, top: 0, bottom: 0, width: "35%", background: "transparent", border: "none" }} />
          </div>
          {chrome && (
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 18px", borderTop: "1px solid " + RULE }}>
              <button data-action="prev-chapter" onClick={() => onChapter(-1)} style={{ background: "none", border: "none", color: INK, fontSize: 13 }}>上一章</button>
              <button data-action="prefs" onClick={onPrefs} style={{ background: "none", border: "none", color: INK, fontSize: 13 }}>阅读偏好</button>
              <button data-action="next-chapter" onClick={() => onChapter(1)} style={{ background: "none", border: "none", color: INK, fontSize: 13 }}>下一章</button>
            </div>
          )}
          <button data-action="footer" data-progress={progressMode} onClick={onFooter} style={{ height: 28, flex: "none", display: "flex", alignItems: "center", justifyContent: "space-between", padding: "0 18px", background: PAPER, border: "none", borderTop: "1px solid " + RULE, color: showWords ? SOFT : "transparent", fontSize: 11, letterSpacing: "0.02em" }}>
            <span>本章还剩 {left} 页</span>
            <span style={{ fontFamily: NEWS, fontStyle: "italic" }}>{percent}%</span>
          </button>
          <div style={{ position: "absolute", width: 1, height: 1, overflow: "hidden" }}>{hand}</div>
        </div>
      );
    }

    function Prefs({ mode, hand, progressMode, onMode, onHand, onProgress, onBack }) {
      const choice = (active) => ({ background: "none", border: "none", borderBottom: active ? "1px solid " + INK : "1px solid transparent", color: active ? INK : SOFT, fontSize: 16, padding: "6px 0", marginRight: 22 });
      const showWords = progressMode !== "hidden";
      return (
        <div style={paperStyles.app}>
          <div style={{ padding: "14px 22px", display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
            <button data-action="back" onClick={onBack} style={{ background: "none", border: "none", color: SOFT, fontSize: 14, padding: 0 }}>返回</button>
            <div style={{ fontFamily: NEWS, fontStyle: "italic", fontSize: 13, color: SOFT }}>只保存在这台设备</div>
          </div>
          <div style={{ padding: "8px 22px 0" }}>
            <div style={{ fontSize: 28, fontWeight: 600, marginBottom: 22 }}>阅读偏好</div>
            <div style={{ fontSize: 13, color: SOFT, marginBottom: 8 }}>阅读方式</div>
            <div>
              <button data-action="mode-scroll" onClick={() => onMode("scroll")} style={choice(mode === "scroll")}>上下滚动</button>
              <button data-action="mode-page" onClick={() => onMode("page")} style={choice(mode === "page")}>单页翻页</button>
            </div>
            <p style={{ color: SOFT, fontSize: 13, lineHeight: 1.6 }}>{mode === "page" ? "一屏一页。点持机的一侧向后翻页。" : "在这一章里上下移动。"}</p>
            <div style={{ fontSize: 13, color: SOFT, margin: "18px 0 8px" }}>持机手</div>
            <div>
              <button data-action="hand-left" onClick={() => onHand("left")} style={choice(hand === "left")}>左手</button>
              <button data-action="hand-right" onClick={() => onHand("right")} style={choice(hand === "right")}>右手</button>
            </div>
            <p style={{ color: SOFT, fontSize: 13, lineHeight: 1.6 }}>{hand === "left" ? "点左侧向后翻页，点右侧向前翻页。" : "点右侧向后翻页，点左侧向前翻页。"}</p>
            <div style={{ fontSize: 13, color: SOFT, margin: "18px 0 8px" }}>本章进度</div>
            <div>
              <button data-action="progress-hidden" onClick={() => onProgress("hidden")} style={choice(progressMode === "hidden")}>隐藏</button>
              <button data-action="progress-shown" onClick={() => onProgress("shown")} style={choice(progressMode === "shown")}>显示</button>
              <button data-action="progress-pinned" onClick={() => onProgress("pinned")} style={choice(progressMode === "pinned")}>固定</button>
            </div>
          </div>
          <div style={{ flex: 1 }} />
          <div data-progress={progressMode} style={{ height: 28, display: "flex", alignItems: "center", justifyContent: "space-between", padding: "0 18px", borderTop: "1px solid " + RULE, color: showWords ? SOFT : "transparent", fontSize: 11 }}>
            <span>本章还剩 12 页</span>
            <span style={{ fontFamily: NEWS, fontStyle: "italic" }}>62%</span>
          </div>
        </div>
      );
    }

    function AppPhone({ phoneId, initial }) {
      const [screen, setScreen] = useState(initial.screen);
      const [view, setView] = useState(initial.view || "list");
      const [query, setQuery] = useState(initial.query || "");
      const [offlineOnly, setOfflineOnly] = useState(false);
      const [books, setBooks] = useState(SEED.map((book) => ({ ...book })));
      const [menuBook, setMenuBook] = useState(null);
      const [dialog, setDialog] = useState(null);
      const [draft, setDraft] = useState("");
      const [confirmDelete, setConfirmDelete] = useState(false);
      const [moreOpen, setMoreOpen] = useState(false);
      const [passwordError, setPasswordError] = useState("");
      const [openId, setOpenId] = useState(initial.bookId || "bian");
      const [page, setPage] = useState(initial.page || 0);
      const [chrome, setChrome] = useState(!!initial.chrome);
      const [progressMode, setProgressMode] = useState(initial.progress || "shown");
      const [hand, setHand] = useState("right");
      const [mode, setMode] = useState("page");
      const [importName, setImportName] = useState("湖滨散记.epub");
      const [importTag, setImportTag] = useState("");

      const book = books.find((item) => item.id === openId) || books[0];

      function openBook(target) {
        setMoreOpen(false);
        if (target.locked) {
          setDraft("");
          setPasswordError("");
          setDialog({ type: "password", book: target });
          return;
        }
        setBooks((prev) => prev.map((item) => ({ ...item, current: item.id === target.id })));
        setOpenId(target.id);
        setPage(0);
        setChrome(false);
        setScreen("reader");
      }

      function onZone(side) {
        if (side === "center") {
          setChrome((value) => !value);
          return;
        }
        const forward = hand === "right" ? side === "right" : side === "left";
        setChrome(false);
        setPage((value) => forward ? Math.min(PAGES.length - 1, value + 1) : Math.max(0, value - 1));
      }

      function cycleFooter() {
        setProgressMode((value) => value === "hidden" ? "shown" : value === "shown" ? "pinned" : "hidden");
      }

      function saveTag() {
        const target = dialog && dialog.book;
        if (!target) return;
        setBooks((prev) => prev.map((item) => item.id === target.id ? { ...item, tag: draft.trim() } : item));
        setDialog(null);
      }

      function saveRename() {
        const target = dialog && dialog.book;
        const next = draft.trim();
        if (!target || !next) return;
        setBooks((prev) => prev.map((item) => item.id === target.id ? { ...item, title: next } : item));
        setDialog(null);
      }

      function addBook() {
        const title = importName.replace(/\.(epub|pdf|txt|kepub)$/i, "") || "未命名";
        const id = "new-" + Date.now();
        setBooks((prev) => prev.concat([{ id, title, author: "未知作者", format: "EPUB", tag: importTag.trim(), progress: 0, downloaded: true, locked: false, current: false }]));
        setDialog(null);
        setImportTag("");
      }

      function unlock() {
        if (draft.trim().length < 4) {
          setPasswordError("密码不正确");
          return;
        }
        const target = dialog.book;
        setDialog(null);
        setBooks((prev) => prev.map((item) => ({ ...item, current: item.id === target.id })));
        setOpenId(target.id);
        setPage(0);
        setChrome(false);
        setScreen("reader");
      }

      return (
        <div data-phone={phoneId} style={{ display: "inline-block" }}>
          <AndroidFrame>
            <div style={{ height: "100%", position: "relative" }}>
              {screen === "shelf" && (
                <Shelf
                  books={books}
                  view={view}
                  query={query}
                  offlineOnly={offlineOnly}
                  onQuery={setQuery}
                  onOffline={setOfflineOnly}
                  onToggleView={() => setView((value) => value === "list" ? "grid" : "list")}
                  onOpen={openBook}
                  onMenu={(target) => { setMenuBook(target); setConfirmDelete(false); }}
                  onAdd={() => { setImportTag(""); setDialog({ type: "add" }); }}
                  moreOpen={moreOpen}
                  onMore={() => setMoreOpen((value) => !value)}
                />
              )}
              {screen === "reader" && book && (
                <Reader
                  book={book}
                  page={page}
                  chrome={chrome}
                  progressMode={progressMode}
                  hand={hand}
                  onZone={onZone}
                  onFooter={cycleFooter}
                  onBack={() => setScreen("shelf")}
                  onPrefs={() => setScreen("prefs")}
                  onChapter={(step) => { setPage(0); setChrome(false); }}
                />
              )}
              {screen === "prefs" && (
                <Prefs
                  mode={mode}
                  hand={hand}
                  progressMode={progressMode}
                  onMode={setMode}
                  onHand={setHand}
                  onProgress={setProgressMode}
                  onBack={() => setScreen("reader")}
                />
              )}
              {menuBook && (
                <Sheet title={menuBook.title} onClose={() => setMenuBook(null)}>
                  {confirmDelete ? (
                    <div>
                      <p style={{ color: SOFT, fontSize: 14, lineHeight: 1.6 }}>从书架删除《{menuBook.title}》。网盘里的文件、本机缓存和阅读进度会一起去掉。</p>
                      <button data-action="confirm-delete" style={paperStyles.sheetRow} onClick={() => { setBooks((prev) => prev.filter((item) => item.id !== menuBook.id)); setMenuBook(null); }}>确定删除</button>
                      <button style={paperStyles.sheetRow} onClick={() => setConfirmDelete(false)}>取消</button>
                    </div>
                  ) : (
                    <div>
                      <button data-action="rename" style={paperStyles.sheetRow} onClick={() => { setDraft(menuBook.title); setDialog({ type: "rename", book: menuBook }); setMenuBook(null); }}>修改书名</button>
                      <button data-action="edit-tag" style={paperStyles.sheetRow} onClick={() => { setDraft(menuBook.tag); setDialog({ type: "tag", book: menuBook }); setMenuBook(null); }}>修改标签</button>
                      <button style={paperStyles.sheetRow} onClick={() => { setDraft(""); setPasswordError(""); setDialog({ type: "protect", book: menuBook }); setMenuBook(null); }}>{menuBook.locked ? "取消密码保护" : "密码保护"}</button>
                      <button data-action="delete" style={paperStyles.sheetRow} onClick={() => setConfirmDelete(true)}>删除书籍</button>
                    </div>
                  )}
                </Sheet>
              )}
              {dialog && dialog.type === "tag" && (
                <Sheet title="修改标签" onClose={() => setDialog(null)}>
                  <input className="pr-field" data-action="tag-field" value={draft} onChange={(e) => setDraft(e.target.value)} placeholder="标签" style={paperStyles.field} />
                  <button data-action="save-tag" style={paperStyles.sheetRow} onClick={saveTag}>确定</button>
                  <button style={paperStyles.sheetRow} onClick={() => setDialog(null)}>取消</button>
                </Sheet>
              )}
              {dialog && dialog.type === "rename" && (
                <Sheet title="修改书名" onClose={() => setDialog(null)}>
                  <input className="pr-field" value={draft} onChange={(e) => setDraft(e.target.value)} placeholder="书名" style={paperStyles.field} />
                  <button data-action="save-rename" style={paperStyles.sheetRow} onClick={saveRename}>确定</button>
                  <button style={paperStyles.sheetRow} onClick={() => setDialog(null)}>取消</button>
                </Sheet>
              )}
              {dialog && dialog.type === "add" && (
                <Sheet title="添加书籍" onClose={() => setDialog(null)}>
                  <div style={{ color: SOFT, fontSize: 14, marginTop: 6 }}>{importName}</div>
                  <input className="pr-field" data-action="import-tag" value={importTag} onChange={(e) => setImportTag(e.target.value)} placeholder="标签" style={paperStyles.field} />
                  <button data-action="confirm-import" style={paperStyles.sheetRow} onClick={addBook}>确定</button>
                  <button style={paperStyles.sheetRow} onClick={() => setDialog(null)}>取消</button>
                </Sheet>
              )}
              {dialog && (dialog.type === "password" || dialog.type === "protect") && (
                <Sheet title={dialog.type === "password" ? "输入密码" : "密码保护"} onClose={() => setDialog(null)}>
                  <input className="pr-field" data-action="password" type="password" value={draft} onChange={(e) => setDraft(e.target.value)} placeholder="密码" style={paperStyles.field} />
                  {passwordError && <div style={{ color: SOFT, fontSize: 12, marginTop: 8 }}>{passwordError}</div>}
                  <button data-action="confirm-password" style={paperStyles.sheetRow} onClick={() => dialog.type === "password" ? unlock() : (draft.trim().length >= 4 ? (setBooks((prev) => prev.map((item) => item.id === dialog.book.id ? { ...item, locked: !item.locked } : item)), setDialog(null)) : setPasswordError("密码至少 4 位"))}>确定</button>
                  <button style={paperStyles.sheetRow} onClick={() => setDialog(null)}>取消</button>
                </Sheet>
              )}
            </div>
          </AndroidFrame>
        </div>
      );
    }

    const { useState } = React;

    const PHONES = [
      { id: "list", label: "书架 · 列表。点书名进入阅读。", initial: { screen: "shelf", view: "list" } },
      { id: "grid", label: "书架 · 网格。在读的一本是墨色封面。", initial: { screen: "shelf", view: "grid" } },
      { id: "page", label: "单页。点右侧向后翻，点中间出工具栏，点底部换进度。", initial: { screen: "reader", progress: "shown" } },
      { id: "chrome", label: "工具栏已打开。再翻一页，工具栏会收起。", initial: { screen: "reader", chrome: true, progress: "shown" } },
      { id: "prefs", label: "阅读偏好。方式、持机手、进度留白。", initial: { screen: "prefs", progress: "shown" } },
      { id: "search", label: "搜索「小说」。书名、作者、标签都能对上。", initial: { screen: "shelf", view: "list", query: "小说" } }
    ];

    function Gallery() {
      return (
        <div style={{ padding: "42px 40px 64px", maxWidth: 1680, margin: "0 auto" }}>
          <div style={{ fontFamily: NEWS, fontStyle: "italic", color: SOFT, fontSize: 15 }}>纸感 · 原型</div>
          <h1 style={{ fontWeight: 600, fontSize: 44, margin: "6px 0 12px", letterSpacing: "-0.02em" }}>书架与阅读</h1>
          <p style={{ maxWidth: 640, color: SOFT, fontSize: 16, lineHeight: 1.7, marginTop: 0 }}>
            纸底 #F4EFE6，墨色 #241C14 只用在在读、进度和当前选项上。封面没有图，书名本身就是封面。语言、同步、词典收在「更多」里。页内文字是排版样张，不是书中原文。六台都可以点。
          </p>
          <div style={{ display: "flex", gap: 28, flexWrap: "wrap", alignItems: "flex-start", marginTop: 28 }}>
            {PHONES.map((phone) => (
              <div key={phone.id}>
                <div style={{ fontFamily: NEWS, fontStyle: "italic", fontSize: 14, color: SOFT, margin: "0 0 8px 8px", maxWidth: 360 }}>{phone.label}</div>
                <AppPhone phoneId={phone.id} initial={phone.initial} />
              </div>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Gallery />);
  </script>
</body>
</html>
